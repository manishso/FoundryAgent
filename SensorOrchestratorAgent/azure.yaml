# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: sensor-orchestrator
services:
    ai-project:
        host: azure.ai.project
    sensor-orchestrator:
        project: .
        host: azure.ai.agent
        language: docker
        docker:
            remoteBuild: true
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: |
            MAF orchestrator agent that answers sensor questions using the get_live_sensor_data and get_history tools.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Responses Protocol
        name: sensor-orchestrator
        protocols:
            - protocol: responses
              version: 2.0.0
